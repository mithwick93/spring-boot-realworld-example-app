name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude never posts anything itself - having it invoke gh or an MCP
          # comment tool from inside its own sandbox is unreliable in headless mode
          # (see anthropics/claude-code-action#647). Instead Claude returns
          # structured JSON, and a plain follow-up step (outside Claude's own
          # tool-permission system) posts it with the workflow's GITHUB_TOKEN.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read this pull request's diff using `git diff origin/main...HEAD` (or
            `git show`).

            Review that diff against ONLY this repository's own
            Security Requirements (CLAUDE.md, "## Security Requirements" section):
            1. Input Validation - is all new external input (request bodies, query
               params, file contents) validated via Bean Validation, with @Size bounds
               on new user-supplied string fields, rather than sanitized-and-continued?
            2. Database Access - does any new/changed MyBatis mapper use #{param}
               binding only, never ${param} string substitution or manual concatenation?
            3. Authentication and Secrets - are any credentials, API keys, or the JWT
               signing secret kept out of source/application.properties (env vars only)?
               Is any new password handling using the existing PasswordEncoder (BCrypt)?
               Is any new unauthenticated endpoint flagged for a rate-limiting review?
            4. Output Encoding and Error Handling - do new/changed error paths avoid
               exposing stack traces, internal class names, or file paths to the client?
            5. Dependencies - does any new build.gradle dependency exist for real and use
               a pinned exact version, not a dynamic/"latest" one?

            Do not comment on anything outside these five categories (style, naming,
            unrelated bugs) - this review's only job is Security Requirements compliance.

            Return has_violation (boolean) and comment_body (string): the exact text
            to post as a PR comment. For each violation, comment_body must cite the
            file and line and name which of the five categories it violates. If there
            is no violation of any of the five categories, comment_body must be a
            one-line comment saying so explicitly - never leave it blank.
          claude_args: |
            --allowedTools "Bash(git diff:*),Bash(git show:*)"
            --json-schema '{"type":"object","properties":{"has_violation":{"type":"boolean"},"comment_body":{"type":"string"}},"required":["has_violation","comment_body"]}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Post review as PR comment
        if: always() && steps.claude-review.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STRUCTURED_OUTPUT: ${{ steps.claude-review.outputs.structured_output }}
        run: |
          echo "$STRUCTURED_OUTPUT" | jq -r '.comment_body' > /tmp/review-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/review-comment.md \
            --repo ${{ github.repository }}

